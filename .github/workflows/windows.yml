name: Windows MVP

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version 0.3.0
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: pku-drive-windows-amd64
          path: bin/pku-drive.exe
